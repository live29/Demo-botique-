<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- Reusable boutique emblem: lotus-mandala motif. Monogram text is rendered by main.js from CONFIG.shop.shortName -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8C878"/>
      <stop offset="0.5" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#A87F2E"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="49" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="2 4"/>
  <g stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- lotus petals -->
    <path d="M60 24 C 66 38, 66 48, 60 56 C 54 48, 54 38, 60 24 Z"/>
    <path d="M38 34 C 50 40, 56 48, 58 57 C 48 56, 41 48, 38 34 Z"/>
    <path d="M82 34 C 70 40, 64 48, 62 57 C 72 56, 79 48, 82 34 Z"/>
    <path d="M28 56 C 40 55, 50 58, 56 62 C 47 68, 36 66, 28 56 Z"/>
    <path d="M92 56 C 80 55, 70 58, 64 62 C 73 68, 84 66, 92 56 Z"/>
    <!-- base curve -->
    <path d="M36 74 C 46 84, 74 84, 84 74"/>
    <path d="M42 82 C 50 89, 70 89, 78 82"/>
  </g>
  <circle cx="60" cy="62" r="2.5" fill="url(#gold)"/>
</svg>
